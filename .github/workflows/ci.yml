name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify before publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect application changes
        id: scope
        env:
          VERIFY_REF: ${{ inputs.ref }}
        run: node scripts/ci-changes.mjs

  test:
    name: Test (Linux, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package

  verify:
    name: Verify complete
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests or an intentional skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          RESULT: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$RUN_TESTS" = true ]; then
            test "$RESULT" = success
          else
            test "$RUN_TESTS" = false
            test "$RESULT" = skipped
          fi
